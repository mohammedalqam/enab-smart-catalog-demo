<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Catalog responsive QA</title><style>*{box-sizing:border-box}body{margin:0;background:#eee9ed;color:#251a2b;font:13px Arial,sans-serif}header{height:58px;display:flex;align-items:center;justify-content:center;gap:15px}select{padding:7px;border:1px solid #d3c4cd;border-radius:6px;background:white}main{display:flex;justify-content:center;padding:8px 0 24px}iframe{border:0;background:#fff9f5;box-shadow:0 5px 35px #251a2b15;flex:none}</style></head><body><header><strong>Responsive QA</strong><label>Viewport <select id="width"><option>320</option><option>360</option><option>375</option><option>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label><span id="size"></span></header><main><iframe title="Live catalog responsive viewport" src="./" id="preview"></iframe></main><script>const choices=[320,360,375,390,430,768,1024,1440];const params=new URLSearchParams(location.search);const requested=Number(params.get('width'));const width=choices.includes(requested)?requested:390;const version=params.get('v');const select=document.getElementById('width');const frame=document.getElementById('preview');const size=document.getElementById('size');if(version)frame.src='./?preview='+encodeURIComponent(version);function resize(){frame.style.width=select.value+'px';frame.style.height='844px';size.textContent=select.value+' × 844';}select.value=String(width);resize();select.addEventListener('change',resize);</script></body></html>
